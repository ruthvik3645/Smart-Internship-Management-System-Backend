spring.application.name=smart-internship
server.port=8080

# Development database (in-memory H2). Data resets on restart.
spring.datasource.url=jdbc:h2:mem:internship;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# PostgreSQL: comment out the H2 lines above and set these instead.
# spring.datasource.url=jdbc:postgresql://localhost:5432/internship
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# JWT: set JWT_SECRET to a random string of 32+ characters outside development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
app.jwt.expiration-ms=86400000

# Origins allowed to call the API (the Vite dev server).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smart-internship-management-system-5043.onrender.com,http://localhost:5173,http://127.0.0.1:5173}

# Seeds demo accounts and sample data on an empty database. Set to false in production.
app.seed-demo-data=true
